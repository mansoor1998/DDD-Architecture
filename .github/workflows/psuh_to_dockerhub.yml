name: Build and Push to Docker Hub

# Triggers automatically when code is merged or pushed to the main branch
on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Get the latest code from the repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Headless login to Docker Hub using your GitHub Secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_EMAIL }}
          password: ${{ secrets.DOCKER_HUB_USERNAME }}

      # Step 3: Build the Docker image and push it to the registry
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.backend
          push: true
          # Replace 'my-fastapi-app' with your actual Docker Hub repository name
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/todo-app:latest