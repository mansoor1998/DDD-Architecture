name: Deploy via Ansible
on: workflow_dispatch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Ansible + sshpass
        run: |
          pip install ansible
          sudo apt-get update && sudo apt-get install -y sshpass
          ansible-galaxy collection install community.docker

      - name: Run playbook
        run: |
          ansible-playbook -i "${{ secrets.VPS_IP }}," \
          -u root \
          --extra-vars "ansible_ssh_pass=${{ secrets.VPS_PASSWORD }} ansible_become_pass=${{ secrets.VPS_PASSWORD }} docker_image=${{ secrets.DOCKER_HUB_IMAGE }} dockerhub_user=${{ secrets.DOCKER_HUB_USERNAME }} dockerhub_pass=${{ secrets.DOCKER_HUB_TOKEN }}" \
          ansible/deploy.yml